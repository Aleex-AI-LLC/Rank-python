name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify version matches release tag
        run: |
          PKG_VERSION="$(python -c "import re, pathlib; print(re.search(r'PACKAGE_VERSION = \"([^\"]+)\"', pathlib.Path('src/rank/_constants.py').read_text()).group(1))")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION#.}"
          echo "Package version: $PKG_VERSION"
          echo "Release tag:     $GITHUB_REF_NAME (normalized: $TAG_VERSION)"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package=$PKG_VERSION but tag=$TAG_VERSION. Bump PACKAGE_VERSION in src/rank/_constants.py to match the release tag before publishing."
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
